items:
  - itemType: visual-inspection
    name: >-
      Roof visual inspection — Weekly Home Check, Week 23: identify the
      shingle type (asphalt most common), inspect from the ground with
      binoculars for missing/cracked/curled shingles, check the attic for
      water damage/leaks/light coming through. Notes common failure
      causes: weather, age (asphalt roofs typically last 15-50 years),
      sun exposure (south/west sides degrade faster), lack of
      maintenance. No fixed re-check interval was stated for the
      inspection itself; annual matches its once-per-year newsletter
      slot.
    intervalMonths: 12
