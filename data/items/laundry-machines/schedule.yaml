# Sourced from Kyshawn's Weekly Home Check newsletter (Home@weeklyhomecheck.com),
# full 52-week archive extracted from Brady's Gmail on 2026-07-23. Weeks
# 3/16/30/44 all cover this with the same "three months have passed"
# framing — genuinely quarterly, not a data-collection artifact.
items:
  - itemType: washer-dryer-clean
    name: >-
      Washing machine & dryer vent cleaning — Weekly Home Check (Weeks
      3/16/30/44, quarterly): washer — scrub dispensers with mild dish
      soap, run a cleaner or hottest/longest cycle for the tub, wipe
      exterior/controls. Front loaders: clean the filter/lint trap (drain
      the hose into a bowl first), spray the rubber door seal with
      vinegar (avoid harsh chemicals on the gasket, call a tech if heavy
      mildew), keep the door open between uses. Dryer — remove/vacuum the
      lint screen, disconnect and clean the ventilation duct with a
      brush/vacuum, wipe the drum interior, vacuum the lint trap housing
      and underneath/behind the machine, reattach the duct avoiding kinks.
    intervalMonths: 3
