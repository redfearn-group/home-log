# Sourced from Kyshawn's Weekly Home Check newsletter (Home@weeklyhomecheck.com),
# full 52-week archive extracted from Brady's Gmail on 2026-07-23. Weeks
# 3/16/30/44 all cover this with the same "three months have passed"
# framing, so genuinely quarterly, not a data-collection artifact.
items:
  - itemType: washer-clean
    name: >-
      Washing machine cleaning — SPLIT 2026-07-28 from a combined
      "washer & dryer vent" item, per Brady: two separate appliances now
      get their own line — the dryer vent duct in particular is a fire-
      safety task that shouldn't be able to ride along silently on a
      washer-only cleaning. Weekly Home Check (Weeks 3/16/30/44,
      quarterly): scrub dispensers with mild dish soap, run a cleaner or
      hottest/longest cycle for the tub, wipe exterior/controls. Front
      loaders: clean the filter/lint trap (drain the hose into a bowl
      first), spray the rubber door seal with vinegar (avoid harsh
      chemicals on the gasket, call a tech if heavy mildew), keep the
      door open between uses.
    intervalMonths: 3
  - itemType: dryer-vent-clean
    name: >-
      Dryer lint screen & vent duct cleaning — SPLIT 2026-07-28 from a
      combined "washer & dryer vent" item, per Brady: this is a fire-
      safety task (blocked dryer vents are a documented house-fire cause)
      and needed its own line so it can never be silently skipped just
      because the washer got cleaned. Weekly Home Check (Weeks 3/16/30/44,
      same quarterly cadence): remove/vacuum the lint screen, disconnect
      and clean the ventilation duct with a brush/vacuum, wipe the drum
      interior, vacuum the lint trap housing and underneath/behind the
      machine, reattach the duct avoiding kinks.
    intervalMonths: 3
