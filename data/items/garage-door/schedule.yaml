items:
  - itemType: lubrication
    name: >-
      Garage door lubrication — Weekly Home Check, Week 24: disconnect
      from power, wipe dirt/dust from the tracks (do NOT lubricate the
      tracks themselves), lubricate hinges/rollers/springs/locks/bearing
      plates with a 3-in-1 or plant-based garage door lubricant
      (explicitly NOT WD-40), wipe off overspray, cycle the door a few
      times to distribute it. No explicit interval stated; annual matches
      its once-per-year newsletter slot.
    intervalMonths: 12
