# Sourced from Kyshawn's Weekly Home Check newsletter (Home@weeklyhomecheck.com),
# full 52-week archive extracted from Brady's Gmail on 2026-07-23.
items:
  - itemType: hardscape-maintenance
    name: >-
      Driveway/patio hardscape upkeep — Weekly Home Check, Week 21: sweep
      debris, pressure wash stains, fill cracks/holes with gap filler
      then seal (asphalt/concrete), or inspect for loose/uneven pavers
      and refill joints with polymeric sand. No explicit interval stated;
      annual matches its once-per-year newsletter slot.
    intervalMonths: 12
  - itemType: pest-proofing
    name: >-
      Pest-proofing & perimeter spray — Weekly Home Check (Weeks 14/21):
      spray bug spray or natural remedies (essential oils, vinegar,
      WD-40) around the home perimeter, entry points, and outdoor
      seating; inspect exterior walls/foundation/doors/windows for gaps
      and seal with steel wool mesh or expandable foam sealant around
      pipes/wires/vents; repair window screen tears with screen repair
      tape. No explicit interval stated; annual matches its once-per-year
      newsletter slot.
    intervalMonths: 12
