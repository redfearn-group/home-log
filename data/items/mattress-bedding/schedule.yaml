# Sourced from Kyshawn's Weekly Home Check newsletter (Home@weeklyhomecheck.com),
# full 52-week archive extracted from Brady's Gmail on 2026-07-23. Weeks
# 8/34 both explicitly say "six months" — genuinely biannual.
items:
  - itemType: mattress-pillow-care
    name: >-
      Mattress rotation & pillow cleaning — Weekly Home Check (Weeks
      8/34, every 6 months): rotate/flip the mattress for even wear,
      vacuum the surface with an upholstery attachment, spot clean
      stains. Pillows — check the care label; most synthetic pillows are
      machine washable (gentle cycle, extra rinse); down/feather should
      be professionally laundered or spot cleaned; memory foam — wash the
      cover, spot-clean the foam itself (avoid soaking), dry fully with
      dryer balls to fluff.
    intervalMonths: 6
